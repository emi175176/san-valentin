<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Estrella ❤️</title>

<style>
body{
    margin:0;
    padding:0;
    font-family: Arial;
    background: linear-gradient(black, #0d001a);
    color:white;
    text-align:center;
    overflow:hidden;
}

/* Fondo estrellas */
body::before{
    content:"";
    position:fixed;
    width:100%;
    height:100%;
    background:url("https://www.transparenttextures.com/patterns/stardust.png");
    opacity:0.4;
    z-index:-1;
}

/* Sobre */
.sobre{
    width:300px;
    height:200px;
    background:#ff4e8a;
    margin:120px auto;
    border-radius:15px;
    position:relative;
    cursor:pointer;
    box-shadow:0 0 30px #ff4e8a;
}

.sobre::before{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:#ff6fa1;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
}

.sobre span{
    position:absolute;
    bottom:20px;
    width:100%;
    font-size:20px;
}

/* Carta */
.carta{
    display:none;
    max-width:600px;
    margin:30px auto;
    padding:25px;
    background:rgba(255,255,255,0.05);
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,78,138,0.5);
}

/* Fotos */
.galeria{
    display:none;
    justify-content:center;
    gap:20px;
    flex-wrap:wrap;
}

.galeria img{
    width:200px;
    border-radius:20px;
    box-shadow:0 0 20px #ff4e8a;
}

/* Botones */
button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:20px;
    background:#ff4e8a;
    color:white;
    box-shadow:0 0 15px #ff4e8a;
    cursor:pointer;
    transition:.3s;
}

#noBtn{
    position:absolute;
}

/* Mensaje final */
#final{
    display:none;
    font-size:40px;
    color:#ff4e8a;
    text-shadow:0 0 20px #ff4e8a;
    animation:latido 1.5s infinite;
}

@keyframes latido{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

/* Corazones */
.corazon{
    position:fixed;
    top:-10px;
    color:#ff4e8a;
    animation:caer linear infinite;
}
@keyframes caer{
    to{transform:translateY(110vh);}
}
</style>
</head>

<body>

<audio autoplay loop>
<source src="scanlines.mp3">
</audio>

<div class="sobre" onclick="abrir()">
<span>Haz clic para abrir 💌</span>
</div>

<div class="carta" id="carta">
Estrella…  
Desde que llegaste a mi vida, algo cambió.  
No busco algo perfecto, solo algo real contigo 💖
</div>

<div class="galeria" id="fotos">
<img src="foto1.jpg">
<img src="foto2.jpg">
</div>

<div id="pregunta" style="display:none;">
<h1>¿Quieres ser mi San Valentín? ❤️</h1>
<button id="siBtn" onclick="aceptar()">Sí</button>
<button id="noBtn" onmouseover="huir()">No</button>
</div>

<div id="final">
TE AMO 💖<br>
Gracias por elegirnos ✨
</div>

<script>
let noScale=1, siScale=1;

function abrir(){
    document.querySelector(".sobre").style.display="none";
    document.getElementById("carta").style.display="block";
    document.getElementById("fotos").style.display="flex";
    setTimeout(()=>{
        document.getElementById("pregunta").style.display="block";
    },2000);
}

function huir(){
    const no = document.getElementById("noBtn");
    noScale -= 0.1;
    siScale += 0.1;

    no.style.transform=scale(${noScale});
    document.getElementById("siBtn").style.transform=scale(${siScale});

    no.style.left = Math.random()*80 + "vw";
    no.style.top = Math.random()*80 + "vh";
}

function aceptar(){
    document.getElementById("pregunta").style.display="none";
    document.getElementById("final").style.display="block";
}

/* corazones */
setInterval(()=>{
 let c=document.createElement("div");
 c.classList.add("corazon");
 c.innerHTML="❤";
 c.style.left=Math.random()*100+"vw";
 c.style.fontSize=Math.random()*20+10+"px";
 c.style.animationDuration=Math.random()*3+3+"s";
 document.body.appendChild(c);
 setTimeout(()=>c.remove(),6000);
},300);
</script>

</body>
</html>
